<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rokuro</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f5f5f5;
        font-family: sans-serif;
      }

      main {
        text-align: center;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 24px;
        color: #333;
      }

      #canvas {
        display: block;
        margin: 0 auto;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
</head>
<body>
  <main>
    <h1>rokuro</h1>
    <canvas id="canvas" width="300" height="300"></canvas>
  </main>
  
</body>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let isDrawing = false;
let lastX = 0;
let lastY = 0;
let rotation = 0;

// 描画パスを保存する配列
const paths = [];
let currentPath = [];

// 座標取得（マウスとタッチ両対応）
function getPosition(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  // キャンバスのスケーリングを考慮
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;

  return { x, y };
}

// 回転を逆算して元の座標を取得
function getOriginalPosition(x, y) {
  // 中心座標
  const cx = 150;
  const cy = 150;

  // 中心からの相対座標
  const dx = x - cx;
  const dy = y - cy;

  // 回転を逆に適用
  const cos = Math.cos(-rotation);
  const sin = Math.sin(-rotation);

  const originalX = dx * cos - dy * sin + cx;
  const originalY = dx * sin + dy * cos + cy;

  return { x: originalX, y: originalY };
}

// 描画開始
function startDrawing(e) {
  isDrawing = true;
  const pos = getPosition(e);
  const original = getOriginalPosition(pos.x, pos.y);
  lastX = pos.x;
  lastY = pos.y;
  currentPath = [{ x: original.x, y: original.y }];
  e.preventDefault();
}

// 描画中
function drawLine(e) {
  if (!isDrawing) return;

  const pos = getPosition(e);
  const original = getOriginalPosition(pos.x, pos.y);
  currentPath.push({ x: original.x, y: original.y });

  lastX = pos.x;
  lastY = pos.y;
  e.preventDefault();
}

// 描画終了
function stopDrawing() {
  if (isDrawing && currentPath.length > 0) {
    paths.push([...currentPath]);
    currentPath = [];
  }
  isDrawing = false;
}

// アニメーションループ
function animate() {
  // 背景をクリア
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, 300, 300);

  // 円を描画
  ctx.beginPath();
  ctx.arc(150, 150, 100, 0, Math.PI * 2);
  ctx.fillStyle = "#FFB6C1";
  ctx.fill();

  // 回転を適用して全パスを描画
  ctx.save();
  ctx.translate(150, 150); // 中心に移動
  ctx.rotate(rotation); // 回転
  ctx.translate(-150, -150); // 元に戻す

  ctx.strokeStyle = "#333";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // 保存されたパスを描画
  paths.forEach(path => {
    if (path.length > 1) {
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (let i = 1; i < path.length; i++) {
        ctx.lineTo(path[i].x, path[i].y);
      }
      ctx.stroke();
    }
  });

  // 現在描画中のパスを描画
  if (currentPath.length > 1) {
    ctx.beginPath();
    ctx.moveTo(currentPath[0].x, currentPath[0].y);
    for (let i = 1; i < currentPath.length; i++) {
      ctx.lineTo(currentPath[i].x, currentPath[i].y);
    }
    ctx.stroke();
  }

  ctx.restore();

  // 回転を更新（0.01ラジアン/フレーム）
  rotation += 0.01;

  requestAnimationFrame(animate);
}

// マウスイベント
canvas.addEventListener("mousedown", startDrawing);
canvas.addEventListener("mousemove", drawLine);
canvas.addEventListener("mouseup", stopDrawing);
canvas.addEventListener("mouseout", stopDrawing);

// タッチイベント（モバイル対応）
canvas.addEventListener("touchstart", startDrawing);
canvas.addEventListener("touchmove", drawLine);
canvas.addEventListener("touchend", stopDrawing);

// アニメーション開始
animate();
</script>
