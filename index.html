<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rokuro</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f5f5f5;
        font-family: sans-serif;
      }

      main {
        text-align: center;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 24px;
        color: #333;
      }

      #canvas {
        display: block;
        margin: 0 auto;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .controls {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      label {
        font-size: 14px;
        color: #666;
      }

      input[type="range"] {
        width: 200px;
      }

      .speed-value {
        min-width: 40px;
        text-align: center;
        font-size: 14px;
        color: #333;
      }

      .color-palette {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .color-button {
        width: 32px;
        height: 32px;
        border: 3px solid transparent;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
      }

      .color-button:hover {
        transform: scale(1.1);
      }

      .color-button.active {
        border-color: #333;
        transform: scale(1.15);
      }
    </style>
</head>
<body>
  <main>
    <h1>rokuro</h1>
    <canvas id="canvas" width="300" height="300"></canvas>
    <div class="controls">
      <div class="control-group">
        <label for="speed">回転速度:</label>
        <input type="range" id="speed" min="0" max="50" value="1" step="1">
        <span class="speed-value" id="speedValue">1</span>
      </div>
      <div class="control-group">
        <label for="lineWidth">線の太さ:</label>
        <input type="range" id="lineWidth" min="1" max="20" value="10" step="1">
        <span class="speed-value" id="lineWidthValue">10</span>
      </div>
      <div class="control-group">
        <label>色:</label>
        <div class="color-palette" id="colorPalette"></div>
      </div>
    </div>
  </main>
  
</body>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let isDrawing = false;
let lastX = 0;
let lastY = 0;
let rotation = 0;
let rotationSpeed = 0.05; // 初期回転速度（1 * 0.05）
let lineWidth = 10; // 初期線の太さ
let currentColor = "#333"; // 初期色

// カラーパレット
const colors = [
  "#333333", // ブラック
  "#E74C3C", // レッド
  "#E67E22", // オレンジ
  "#F39C12", // イエロー
  "#2ECC71", // グリーン
  "#3498DB", // ブルー
  "#9B59B6", // パープル
  "#E91E63", // ピンク
  "#1ABC9C", // ターコイズ
  "#95A5A6"  // グレー
];

// 描画パスを保存する配列（線の太さと色も保存）
const paths = [];
let currentPath = [];

// 回転速度スライダー
const speedSlider = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");

speedSlider.addEventListener("input", (e) => {
  const value = parseInt(e.target.value);
  speedValue.textContent = value;
  rotationSpeed = value * 0.05; // 0-2.5の範囲に変換
  console.log("Speed changed to:", value, "rotationSpeed:", rotationSpeed);
});

// 線の太さスライダー
const lineWidthSlider = document.getElementById("lineWidth");
const lineWidthValue = document.getElementById("lineWidthValue");

lineWidthSlider.addEventListener("input", (e) => {
  const value = parseInt(e.target.value);
  lineWidthValue.textContent = value;
  lineWidth = value;
});

// カラーパレットを作成
const colorPalette = document.getElementById("colorPalette");
colors.forEach((color, index) => {
  const button = document.createElement("div");
  button.className = "color-button" + (index === 0 ? " active" : "");
  button.style.backgroundColor = color;
  button.addEventListener("click", () => {
    // すべてのボタンからactiveクラスを削除
    document.querySelectorAll(".color-button").forEach(btn => {
      btn.classList.remove("active");
    });
    // クリックされたボタンにactiveクラスを追加
    button.classList.add("active");
    currentColor = color;
  });
  colorPalette.appendChild(button);
});

// 座標取得（マウスとタッチ両対応）
function getPosition(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  // キャンバスのスケーリングを考慮
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;

  return { x, y };
}

// 回転を逆算して元の座標を取得
function getOriginalPosition(x, y) {
  // 中心座標
  const cx = 150;
  const cy = 150;

  // 中心からの相対座標
  const dx = x - cx;
  const dy = y - cy;

  // 回転を逆に適用
  const cos = Math.cos(-rotation);
  const sin = Math.sin(-rotation);

  const originalX = dx * cos - dy * sin + cx;
  const originalY = dx * sin + dy * cos + cy;

  return { x: originalX, y: originalY };
}

// 現在のマウス/タッチ位置を保存
let currentMousePos = null;

// 描画開始
function startDrawing(e) {
  isDrawing = true;
  const pos = getPosition(e);
  currentMousePos = pos;
  const original = getOriginalPosition(pos.x, pos.y);
  lastX = pos.x;
  lastY = pos.y;
  currentPath = {
    points: [{ x: original.x, y: original.y }],
    lineWidth: lineWidth,
    color: currentColor
  };
  e.preventDefault();
}

// 描画中
function drawLine(e) {
  if (!isDrawing) return;

  const pos = getPosition(e);
  currentMousePos = pos;
  const original = getOriginalPosition(pos.x, pos.y);
  currentPath.points.push({ x: original.x, y: original.y });

  lastX = pos.x;
  lastY = pos.y;
  e.preventDefault();
}

// 描画終了
function stopDrawing() {
  if (isDrawing && currentPath.points && currentPath.points.length > 0) {
    paths.push({ ...currentPath, points: [...currentPath.points] });
    currentPath = { points: [], lineWidth: lineWidth, color: currentColor };
  }
  isDrawing = false;
  currentMousePos = null;
}

// アニメーションループ
function animate() {
  // マウスが押されたままで回転している場合、新しい点を追加
  if (isDrawing && currentMousePos && rotationSpeed !== 0) {
    const original = getOriginalPosition(currentMousePos.x, currentMousePos.y);
    currentPath.points.push({ x: original.x, y: original.y });
  }

  // 背景をクリア
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, 300, 300);

  // 円を描画
  ctx.beginPath();
  ctx.arc(150, 150, 100, 0, Math.PI * 2);
  ctx.fillStyle = "#FFB6C1";
  ctx.fill();

  // 回転を適用して全パスを描画
  ctx.save();
  ctx.translate(150, 150); // 中心に移動
  ctx.rotate(rotation); // 回転
  ctx.translate(-150, -150); // 元に戻す

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // 保存されたパスを描画
  paths.forEach(path => {
    if (path.points && path.points.length > 1) {
      ctx.strokeStyle = path.color;
      ctx.lineWidth = path.lineWidth;
      ctx.beginPath();
      ctx.moveTo(path.points[0].x, path.points[0].y);
      for (let i = 1; i < path.points.length; i++) {
        ctx.lineTo(path.points[i].x, path.points[i].y);
      }
      ctx.stroke();
    }
  });

  // 現在描画中のパスを描画
  if (currentPath.points && currentPath.points.length > 1) {
    ctx.strokeStyle = currentPath.color;
    ctx.lineWidth = currentPath.lineWidth;
    ctx.beginPath();
    ctx.moveTo(currentPath.points[0].x, currentPath.points[0].y);
    for (let i = 1; i < currentPath.points.length; i++) {
      ctx.lineTo(currentPath.points[i].x, currentPath.points[i].y);
    }
    ctx.stroke();
  }

  ctx.restore();

  // 回転を更新
  rotation += rotationSpeed;

  requestAnimationFrame(animate);
}

// マウスイベント
canvas.addEventListener("mousedown", startDrawing);
canvas.addEventListener("mousemove", drawLine);
canvas.addEventListener("mouseup", stopDrawing);
canvas.addEventListener("mouseout", stopDrawing);

// タッチイベント（モバイル対応）
canvas.addEventListener("touchstart", startDrawing);
canvas.addEventListener("touchmove", drawLine);
canvas.addEventListener("touchend", stopDrawing);

// アニメーション開始
animate();
</script>
